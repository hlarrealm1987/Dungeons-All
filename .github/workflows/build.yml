name: Build Dungeons All

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Unzip source
        run: |
          if [ -f src.zip ]; then rm -rf src; unzip -o -q src.zip; fi
      - name: Show all compile errors
        run: echo "tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs','2000'] }" >> build.gradle
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build-log.txt
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dungeonsall-jar
          path: build/libs/*.jar
